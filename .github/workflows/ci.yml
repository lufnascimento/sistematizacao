name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r platform/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q platform scripts tests

      - name: Validate JSON documents
        shell: python
        run: |
          import json
          from pathlib import Path

          for root in (Path("config"), Path("schemas")):
              for path in root.glob("*.json"):
                  with path.open(encoding="utf-8") as stream:
                      json.load(stream)

      - name: Run platform unit tests
        run: python -m unittest discover -s platform/tests -p "test_*.py" -v

      - name: Run dossier unit tests
        run: python -m unittest discover -s tests -p "test_generate_platform_run_dossier.py" -v

      - name: Run public preset lineage tests
        run: python -m unittest -v tests.test_system_presets tests.test_compile_project_request_from_presets

      - name: Run platform parameter binding tests
        run: python -m unittest -v tests.test_build_platform_engine_request

      - name: Run PCE0 and PCX0 contract tests
        run: python -m unittest -v tests.test_pce_pcx tests.test_run_pce_pcx_screening

      - name: Run PCX1 rainfall-excess tests
        run: python -m unittest -v tests.test_pcx1_runoff

      - name: Run preliminary hydrograph tests
        run: python -m unittest -v tests.test_pcx2_hydrograph

      - name: Run preliminary network-routing tests
        run: python -m unittest -v tests.test_preliminary_reach_routing

      - name: Run preliminary section-capacity tests
        run: python -m unittest -v tests.test_preliminary_section_capacity

      - name: Run preliminary water-profile tests
        run: python -m unittest -v tests.test_preliminary_backwater_profile

      - name: Run preliminary overflow-path tests
        run: python -m unittest -v tests.test_preliminary_overflow_path_screening tests.test_overflow_geojson

  geospatial-inspection:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system geospatial test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-numpy python3-matplotlib python3-pandas python3-scipy python3-shapely nodejs
      - name: Verify terrain and vector derivatives
        run: /usr/bin/python3 -m unittest -v tests.test_terrain_web_mesh tests.test_terrain_coverage tests.test_contours_web tests.test_boundaries_web tests.test_rows_web
      - name: Verify mesh clipping and interpolation
        run: node platform/tests/test_terrain_surface.mjs
      - name: Verify scenario comparison eligibility and scope
        run: node platform/tests/test_scenario_comparison.mjs
      - name: Verify historical result selection
        run: node platform/tests/test_result_runs.mjs
      - name: Verify source longitudinal profile validation
        run: node platform/tests/test_line_profile.mjs
