<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerraFlux | Mapa da rodada</title>
  <link rel="stylesheet" href="map.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
  <script src="./vendor/lucide.min.js" defer></script>
</head>
<body>
  <header><a id="back" href="/">Voltar aos resultados</a><strong>TerraFlux / Mapa da rodada</strong><span id="status" role="status">Carregando</span></header>
  <main>
    <aside aria-label="Camadas"><h1>Camadas</h1><div id="layers"></div><h2>Objeto selecionado</h2><dl id="selection"><dt>Selecao</dt><dd>Nenhum objeto</dd></dl></aside>
    <section id="viewport" aria-label="Mapa dos produtos">
      <div class="toolbar">
        <button id="fit" type="button" title="Enquadrar camadas" aria-label="Enquadrar camadas"><i data-lucide="scan"></i></button>
        <button id="zoom-in" type="button" title="Aproximar" aria-label="Aproximar"><i data-lucide="plus"></i></button>
        <button id="zoom-out" type="button" title="Afastar" aria-label="Afastar"><i data-lucide="minus"></i></button>
        <button id="plan" aria-pressed="true" title="Vista em planta">2D</button><button id="orbit" disabled aria-pressed="false" title="Vista tridimensional do terreno">3D</button>
      </div>
      <p id="empty" hidden></p>
      <footer><span id="terrain-status">Sem terreno publicado</span><span id="position"></span></footer>
    </section>
  </main>
  <script type="module" src="map.js"></script>
</body>
</html>
